name: CI - Frontend

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  frontend-lint:
    # 实际意义：lint + typecheck（advisory，不阻塞 PR；与 cicd.md §十二 12.2 v2.2 修复 R4 一致）
    # **不跑 vite build** —— 构建交给服务器侧 deploy.sh（与 cicd.md §三 D1 一致）
    # 原因：服务器有 @tailwindcss/oxide-linux-x64-gnu 等本地依赖，
    #       GitHub Actions ubuntu-latest build 不一定一致；让服务器本地构建避免环境差异
    name: Lint + Type Check (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: src/frontend
        run: |
          npm ci

      - name: ESLint (advisory)
        working-directory: src/frontend
        run: |
          echo "--- ESLint 检查（warning only, 不阻塞 PR） ---"
          npx eslint . --ext .ts,.tsx,.vue --max-warnings 0 2>&1 | tail -50 || echo "ESLint 有错误，但不阻塞（详见上面输出）"
        continue-on-error: true
        # 注: 仓库历史累积 2614+ 个 lint 错误（之前从未跑过 lint 门禁）
        #     改为 advisory；后续修 lint 错误时移除 continue-on-error
        #     跟踪 issue: TODO

      - name: vue-tsc (advisory)
        working-directory: src/frontend
        run: |
          echo "--- vue-tsc 类型检查（warning only） ---"
          npx vue-tsc --noEmit 2>&1 | tee /tmp/vue-tsc.log | tail -30 || echo "vue-tsc 报错但 CI 不阻塞（详见 /tmp/vue-tsc.log）"
        continue-on-error: true
        # 已知: vue-tsc 报错比 vite build 严格, 历史上有 "vue-tsc fail 但 vite build OK"
        # 改为 advisory, 让 PR 不被卡; 待类型问题修复后再移除 continue-on-error

      # ⚠️ 没有 "Build" 步骤 - 构建在服务器侧做（deploy.sh）
      # 如果未来想要"CI 也能产出 dist 用于 smoke test"，可以加：
      #   - name: Build (服务器环境才有 oxide 等本地依赖)
      #     working-directory: src/frontend
      #     run: npx vite build
      #     continue-on-error: true   # warning only，不阻塞 PR