name: CD - Deploy to Production

# 架构 (v2.2 修复 R2):
#   192.168.0.102 是内网服务器，self-hosted runner 跑在上面
#   runner 主动出公网连 GitHub API 拉 job 并在本地执行 deploy.sh
#   不需要 SSH/密钥（runner 就在本机）
#
# 触发 (v2.2 修复 R2: 避免 push + workflow_run 双触发):
#   - workflow_run: 监听 CI 跑成功，CI 全过才部署
#   - workflow_dispatch: 手动触发（可选填 commit_sha 回滚/重部署）
#   - 故意不接 on: push，避免 merge 后立即部署（与 CI 重复触发）
#
# 通知:
#   - GitHub Actions 内置邮件：失败/成功自动发给 commit 作者 + repo watchers

on:
  # ❌ 不用 on: push —— 那样会与 workflow_run 双触发，导致一次 merge 部署 2 次
  # ✅ 用 workflow_run 监听 CI 成功 —— 合并后等 CI 全过才部署（"CI 通过后自动部署"语义）
  workflow_run:
    workflows: ["CI - Backend", "CI - Frontend"]
    types: [completed]
    branches: [master]
  # 保留手动触发：紧急回滚 / 跳过 CI / 重跑某次部署
  workflow_dispatch:
    inputs:
      commit_sha:
        description: '要部署的 commit SHA (留空用最新 master HEAD)'
        required: false
        default: ''

concurrency:
  group: deploy-prod
  cancel-in-progress: false  # 不取消运行中的部署，避免半成品

jobs:
  deploy:
    name: Deploy to 192.168.0.102
    # 🆕 self-hosted runner: 必须装在 192.168.0.102 上
    #   标签 prod-deployer 是自定义 label，避免其他 workflow 误用此 runner
    runs-on: [self-hosted, linux, prod-deployer]
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    timeout-minutes: 20
    environment:
      name: production
      url: http://192.168.0.102:8080

    steps:
      # 0. 校验 runner 环境
      - name: Verify runner environment
        run: |
          echo "--- 校验环境 ---"
          echo "Runner hostname: $(hostname)"
          echo "Runner user:    $(whoami)"
          EXPECTED_HOSTNAME="xiejava-8g-host"
          ACTUAL_HOSTNAME=$(hostname)
          if [[ "$ACTUAL_HOSTNAME" != *"$EXPECTED_HOSTNAME"* && "$ACTUAL_HOSTNAME" != "192.168.0.102" ]]; then
            echo "WARNING: hostname '$ACTUAL_HOSTNAME' 不是预期的 $EXPECTED_HOSTNAME"
            echo "         请确认 self-hosted runner 装在 192.168.0.102 上"
          fi
          test -d /home/xiejava/AIproject/AI-miniSOC || { echo "ERROR: 项目目录不存在"; exit 1; }
          test -f /home/xiejava/AIproject/AI-miniSOC/deploy/deploy.sh || { echo "ERROR: deploy.sh 不存在"; exit 1; }
          echo "环境校验通过"

      # 1. 计算目标 commit SHA
      - name: Determine target SHA
        id: target
        run: |
          cd /home/xiejava/AIproject/AI-miniSOC
          git fetch origin master
          if [ -n "${{ inputs.commit_sha }}" ]; then
            TARGET="${{ inputs.commit_sha }}"
          else
            TARGET=$(git rev-parse origin/master)
          fi
          echo "value=$TARGET" >> $GITHUB_OUTPUT
          echo "目标 commit: $TARGET"
          git log -1 --oneline "$TARGET"

      # 2. 执行部署 (核心步骤)
      - name: Execute deploy.sh
        run: |
          cd /home/xiejava/AIproject/AI-miniSOC
          bash deploy/deploy.sh "${{ steps.target.outputs.value }}" "GitHub Actions 自动部署 #${{ github.run_number }}"

      # 3. 显示最终状态
      - name: Show final state
        if: always()
        run: |
          echo "=========================================="
          echo "  部署结果"
          echo "=========================================="
          cd /home/xiejava/AIproject/AI-miniSOC
          echo ""
          echo "--- 当前 commit ---"
          git log -1 --oneline
          echo ""
          echo "--- backend 服务状态 ---"
          (sudo -n systemctl status aisoc-backend --no-pager 2>&1 || systemctl status aisoc-backend --no-pager 2>&1 || echo "(systemctl 不可用)") | head -15
          echo ""
          echo "--- /var/log/aisoc/backend.log 末 5 行 ---"
          (sudo -n tail -5 /var/log/aisoc/backend.log 2>/dev/null || tail -5 /var/log/aisoc/backend.log 2>/dev/null || echo "(no log)") | sed 's/^/  /'
          echo ""
          echo "--- /tmp/aisoc-deploy.log 全文 ---"
          cat /tmp/aisoc-deploy.log 2>/dev/null | sed 's/^/  /' || echo "(no log)"

      # 4. 部署后健康检查（v2.2 加 DB 探活）
      - name: Post-deploy health check (HTTP + DB)
        if: success()
        run: |
          sleep 2
          # HTTP 探活
          HTTP=$(curl -s --max-time 5 http://127.0.0.1:8000/api/v1/public/system-info)
          echo "HTTP: $HTTP"
          echo "$HTTP" | grep -q '"code":200' || { echo "ERROR: HTTP 健康检查失败"; exit 1; }

          # DB 探活 (R7 修复)
          DB_HOST=$(grep '^DB_HOST=' src/backend/.env | cut -d= -f2 | tr -d '"' || echo "")
          DB_PORT=$(grep '^DB_PORT=' src/backend/.env | cut -d= -f2 | tr -d '"' || echo "5432")
          DB_NAME=$(grep '^DB_NAME=' src/backend/.env | cut -d= -f2 | tr -d '"' || echo "")
          DB_USER=$(grep '^DB_USER=' src/backend/.env | cut -d= -f2 | tr -d '"' || echo "")
          DB_PASS=$(grep '^DB_PASSWORD=' src/backend/.env | cut -d= -f2 | tr -d '"' || echo "")
          if [[ -n "$DB_HOST" && -n "$DB_NAME" ]]; then
            # 用 venv python + SQLAlchemy 探活（不依赖 psql，服务器可能没装 postgresql-client）
            DB_RESP=$(DB_HOST="$DB_HOST" DB_PORT="$DB_PORT" DB_NAME="$DB_NAME" DB_USER="$DB_USER" DB_PASS="$DB_PASS" \
              src/backend/venv/bin/python deploy/db_healthcheck.py 2>/dev/null || echo "")
            echo "DB: $DB_RESP"
            [[ "$DB_RESP" == "1" ]] || { echo "ERROR: DB 探活失败"; exit 1; }
          else
            echo "WARN: 跳过 DB 探活（.env 缺连接信息）"
          fi
          echo "健康检查通过 ✓"
