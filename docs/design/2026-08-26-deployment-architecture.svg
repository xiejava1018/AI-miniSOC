<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="100%" role="img">
  <title>扫描采集器部署架构 — 控制面/数据面分离</title>
  <desc>AI-miniSOC 中央控制面（192.168.0.102）与 192.168.0.45 Kali 扫描器（数据面）之间的心跳、拉任务、推数据链路，及内网/公网扫描目标。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .t { font-family: var(--font-sans); font-size: 14px; fill: var(--color-text-primary); }
    .th { font-family: var(--font-sans); font-size: 14px; font-weight: 500; fill: var(--color-text-primary); }
    .ts { font-family: var(--font-sans); font-size: 12px; fill: var(--color-text-secondary); }
    .cap { font-family: var(--font-sans); font-size: 11px; fill: var(--color-text-tertiary); }
  </style>

  <!-- ===== 控制面 ===== -->
  <rect x="250" y="48" width="180" height="180" rx="20" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="340" y="70" text-anchor="middle">AI-miniSOC 控制面</text>
  <text class="ts" x="340" y="86" text-anchor="middle">192.168.0.102:8000</text>
  <rect x="268" y="98" width="144" height="28" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="340" y="116" text-anchor="middle">scan_watchdog 60s</text>
  <rect x="268" y="132" width="144" height="28" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="340" y="150" text-anchor="middle">central_scan cron</text>
  <rect x="268" y="166" width="144" height="28" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="0.5"/>
  <text class="ts" x="340" y="184" text-anchor="middle">/scan API</text>
  <rect x="268" y="200" width="144" height="22" rx="8" fill="#ffffff" stroke="#185FA5" stroke-width="0.5"/>
  <text class="cap" x="340" y="215" text-anchor="middle">agents / tasks / findings 表</text>

  <!-- ===== 扫描器 A ===== -->
  <rect x="36" y="300" width="190" height="160" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="131" y="322" text-anchor="middle">192.168.0.45 Kali</text>
  <text class="ts" x="131" y="338" text-anchor="middle">扫描器 A（数据面）</text>
  <text class="ts" x="131" y="362" text-anchor="middle">① 心跳 30s</text>
  <text class="ts" x="131" y="382" text-anchor="middle">② 拉任务 10s</text>
  <text class="ts" x="131" y="402" text-anchor="middle">③ run nmap</text>
  <text class="ts" x="131" y="422" text-anchor="middle">④ 推数据 /data/sync</text>
  <text class="ts" x="131" y="442" text-anchor="middle">⑤ 回写 report</text>

  <!-- ===== 扫描器 B ===== -->
  <rect x="454" y="300" width="190" height="160" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="549" y="322" text-anchor="middle">扫描器 B</text>
  <text class="ts" x="549" y="338" text-anchor="middle">另一子网/机房</text>
  <text class="ts" x="549" y="362" text-anchor="middle">① 心跳 30s</text>
  <text class="ts" x="549" y="382" text-anchor="middle">② 拉任务 10s</text>
  <text class="ts" x="549" y="402" text-anchor="middle">③ run nmap</text>
  <text class="ts" x="549" y="422" text-anchor="middle">④ 推数据 /data/sync</text>
  <text class="ts" x="549" y="442" text-anchor="middle">⑤ 回写 report</text>

  <!-- ===== 目标 ===== -->
  <rect x="36" y="492" width="190" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="131" y="514" text-anchor="middle">内网设备</text>
  <text class="ts" x="131" y="532" text-anchor="middle">192.168.0.0/24</text>

  <rect x="454" y="492" width="190" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="549" y="514" text-anchor="middle">公网资产</text>
  <text class="ts" x="549" y="532" text-anchor="middle">exposure=public</text>

  <!-- ===== 链路：控制面 <-> A ===== -->
  <!-- 下行：拉任务/认领/回写/探活 -->
  <path d="M250,150 C210,210 200,250 226,302" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="150" y="235" fill="#3C3489">拉任务 / 认领 / 回写 / 探活↓</text>
  <!-- 上行：心跳/推数据 -->
  <path d="M226,338 C200,392 210,200 250,172" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="118" y="270" fill="#085041">心跳 / 推数据(discovery,port)↑</text>

  <!-- ===== 链路：控制面 <-> B ===== -->
  <path d="M430,150 C470,210 480,250 454,302" fill="none" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="470" y="235" fill="#3C3489">拉任务 / 认领 / 回写↓</text>
  <path d="M454,338 C480,392 470,200 430,172" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="490" y="270" fill="#085041">心跳 / 推数据↑</text>

  <!-- ===== 扫描器 -> 目标 ===== -->
  <path d="M131,460 L131,492" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="cap" x="138" y="482">nmap -sn (ARP)</text>
  <path d="M549,460 L549,492" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="cap" x="430" y="482" text-anchor="end">nmap -sV</text>

  <!-- 图例 -->
  <rect x="250" y="500" width="180" height="64" rx="10" fill="#ffffff" stroke="#5F5E5A" stroke-width="0.5"/>
  <circle cx="266" cy="518" r="4" fill="#534AB7"/>
  <text class="cap" x="278" y="521">控制面 → 扫描器（指令/任务）</text>
  <circle cx="266" cy="538" r="4" fill="#1D9E75"/>
  <text class="cap" x="278" y="541">扫描器 → 控制面（心跳/数据）</text>
  <circle cx="266" cy="556" r="4" fill="#BA7517"/>
  <text class="cap" x="278" y="559">扫描器 → 目标（nmap）</text>
</svg>
