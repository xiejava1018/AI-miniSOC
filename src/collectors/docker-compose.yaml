services:
  tplink-collector:
    build:
      context: .
      dockerfile: tplink/Dockerfile
    container_name: minisoc-tplink-collector
    restart: unless-stopped
    # 用 tini 当 PID 1 负责收养并回收孤儿进程。
    # 不加的话 PID 1 是业务 python 进程，它从不调用 wait()，而 docker
    # HEALTHCHECK 的 exec 子进程在容器 PID 命名空间内会被 reparent 到 PID 1，
    # 于是无人收尸 —— 生产实测两周堆积 233 个 <defunct>（全部 PPID=容器 PID 1）。
    # 这是「PID 1 不收养孤儿」的标准解，比在业务代码里塞 SIGCHLD SIG_IGN 干净。
    init: true
    environment:
      - MINISOC_URL=${MINISOC_URL:-http://host.docker.internal:8000}
      - MINISOC_API_KEY=${MINISOC_API_KEY}
      - ROUTER_HOST=${ROUTER_HOST:-192.168.0.1}
      - ROUTER_USERNAME=${ROUTER_USERNAME:-tploginadmin}
      - ROUTER_PASSWORD=${ROUTER_PASSWORD}
      - COLLECT_INTERVAL=${TPLINK_INTERVAL:-300}
    mem_limit: 128m
    cpus: 0.5
    networks:
      - minisoc-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  wazuh-collector:
    build:
      context: .
      dockerfile: wazuh/Dockerfile
    container_name: minisoc-wazuh-collector
    restart: unless-stopped
    # 同上。wazuh 侧目前没堆僵尸（healthcheck 一直成功、正常退出即被回收），
    # 但它的 healthcheck 同样是 exec 子进程，一旦哪天超时被 SIGKILL 就会漏。
    # 属防御性配置，不是在修现存故障。
    init: true
    environment:
      - MINISOC_URL=${MINISOC_URL:-http://host.docker.internal:8000}
      - MINISOC_API_KEY=${MINISOC_API_KEY}
      - WAZUH_URL=${WAZUH_URL:-https://192.168.0.40:55000}
      - WAZUH_USER=${WAZUH_USER:-wazuh-wui}
      - WAZUH_PASSWORD=${WAZUH_PASSWORD}
      - COLLECT_INTERVAL=${WAZUH_INTERVAL:-300}
    volumes:
      - ./wazuh/config.yaml:/etc/wazuh-collector/config.yaml:ro
    mem_limit: 256m
    cpus: 0.5
    networks:
      - minisoc-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: |
        python -c "
        import sys; sys.path.insert(0, '/app/src')
        from wazuh_collector.collector import WazuhCollector
        from collector_framework.config import CollectorConfig
        import asyncio

        async def test():
            cfg = CollectorConfig.from_yaml('/etc/wazuh-collector/config.yaml')
            c = WazuhCollector(cfg)
            ok = await c.test_connection()
            sys.exit(0 if ok else 1)
        asyncio.run(test())
        " || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # P3/F-S2 资产发现与攻击面扫描采集器（公网暴露面）
  # 设计：docs/design/2026-08-26-asset-discovery-and-attack-surface-scanner-final.md §10.1
  # Phase 1: 公网端口扫描（-sV）；Phase 2 加 internal discovery
  scanner-collector:
    build:
      context: .
      dockerfile: scanner/Dockerfile
    container_name: minisoc-scanner-collector
    restart: unless-stopped
    init: true
    # nmap 需要 raw socket 发包；Phase 2 内部扫描 ARP 需 host 网络
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # Phase 1 bridge（公网扫描不需 ARP）；Phase 2 加 scanner-internal service 用 host
    networks:
      - minisoc-net
    environment:
      - MINISOC_URL=${MINISOC_URL:-http://host.docker.internal:8000}
      - MINISOC_API_KEY=${MINISOC_API_KEY}
      - SCAN_PUBLIC_TARGETS=${SCAN_PUBLIC_TARGETS:-203.0.113.10}
      - NMAP_TIMEOUT=${SCANNER_NMAP_TIMEOUT:-300}
      - NMAP_MAX_RATE=${SCANNER_MAX_RATE:-100}
      - SCANNER_LOG_LEVEL=${SCANNER_LOG_LEVEL:-INFO}
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # scanner 进程没有持续服务（一次性 --once），healthcheck 用 curl --version 验证 nmap 可用
    healthcheck:
      test: ["CMD-SHELL", "nmap --version >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  minisoc-net:
    driver: bridge
