[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scanner-collector"
version = "1.3.0"
description = "AI-miniSOC 资产发现与攻击面扫描采集器（公网暴露面）"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "collector-framework>=0.1.0",  # 复用 src/collectors/base 的 BaseCollector / MiniSOCClient
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scanner_collector*"]

[tool.setuptools.package-data]
"scanner_collector" = ["*.yaml"]