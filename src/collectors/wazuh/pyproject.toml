[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wazuh-collector"
version = "0.1.0"
description = "Wazuh Collector for AI-miniSOC"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "collector-framework>=0.1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
wazuh-collector = "wazuh_collector.__main__:main"
