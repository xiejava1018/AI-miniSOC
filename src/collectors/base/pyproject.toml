[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "collector-framework"
version = "0.1.0"
description = "AI-miniSOC Collector 共享框架"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["collector_framework*"]
