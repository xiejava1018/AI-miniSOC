[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tplink-collector"
version = "0.1.0"
description = "AI-miniSOC TP-Link 路由器资产采集器"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "collector-framework",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tplink_collector*"]
