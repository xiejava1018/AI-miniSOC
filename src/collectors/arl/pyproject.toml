[project]
name = "arl-collector"
version = "0.1.0"
description = "ARL-Next → AI-miniSOC 攻击面测绘数据采集器（拉模型只读，OH-ARL.1）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["arl_collector*"]
