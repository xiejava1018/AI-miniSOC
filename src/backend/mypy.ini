[mypy]
# OH-Q.1 后端类型检查（v1：建立基线，渐进收紧）
python_version = 3.13
mypy_path = .
namespace_packages = True
explicit_package_bases = True

# SQLAlchemy 2.0 mypy 插件：解析 declarative Column → 标量类型（千+误报的根因）
plugins = sqlalchemy.ext.mypy.plugin

# 渐进式：先不强制全局 strict，聚焦可判定的真实错误
warn_unused_ignores = False
warn_redundant_casts = True
warn_unreachable = False
no_implicit_optional = True
check_untyped_defs = True

# 第三方库：缺 stubs 的不阻断（baseline）
ignore_missing_imports = True

# 排除：生成物 / 采集器 / 虚拟环境
exclude = (?x)(
      alembic/
    | venv/
    | tests/
    | app/services/sync_handlers/
  )

# Pydantic Settings 从 env 注入，mypy 无法看到，关闭 call-arg 误报
[mypy-app.core.config]
disable_error_code = call-arg

# SQLAlchemy 声明式模型动态性强，v1 放宽（后续可逐表收紧）
[mypy-app.models.*]
disable_error_code = assignment,attr-defined

# FastAPI Depends() 返回类型由框架注入，放宽
[mypy-app.api.*]
disable_error_code = call-arg
